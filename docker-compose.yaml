import requests
from PIL import Image
from pymilvus import MilvusClient
from dotenv import load_dotenv

# ---------- ENV ----------
load_dotenv()
NVIDIA_API_KEY = os.environ["NVIDIA_API_KEY"]

# ---------- LOGGING ----------
