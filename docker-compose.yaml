MILVUS_DB = os.path.join(BASE_DIR, "sample_milvus_rag.db")

COLLECTION = "rag_images"
DIM = 8  # small dummy dimension, Milvus Lite requirement

milvus = MilvusClient(uri=MILVUS_DB)

# ---------- IMAGE UTILS ----------
def image_to_base64(path: str) -> str:
    with Image.open(path) as img:
        buf = io.BytesIO()
        img.convert("RGB").save(buf, format="PNG")
        return base64.b64encode(buf.getvalue()).decode()

# ---------- MILVUS INIT ----------
def ensure_collection():
    if not milvus.has_collection(COLLECTION):
        milvus.create_collection(
            collection_name=COLLECTION,
            dimension=DIM,
            metric_type="L2",
            auto_id=True,
        )
        logger.info("✅ Milvus Lite collection created")
    else:
        logger.info("✅ Milvus collection already exists")

# ---------- INGEST IMAGE ----------
def ingest_image(image_path: str):
    img_b64 = image_to_base64(image_path)

    # Milvus Lite REQUIRES a vector field named `vector`
    dummy_vector = [0.0] * DIM

    milvus.insert(
        collection_name=COLLECTION,
        data=[{
            "vector": dummy_vector,       # ✅ correct field name
            "image_base64": img_b64,
        }]
    )

    logger.info("✅ Image inserted into Milvus")

# ---------- RETRIEVE IMAGE ----------
def retrieve_image():
    results = milvus.query(
        collection_name=COLLECTION,
        limit=1,
        output_fields=["image_base64"],
    )

    if not results:
        raise RuntimeError("No image found in Milvus")

    return results[0]["image_base64"]

# ---------- VISION QA ----------
def vision_rag(query: str) -> str:
    image_b64 = retrieve_image()

    response = requests.post(
        "https://integrate.api.nvidia.com/v1/chat/completions",
        headers={
            "Authorization": f"Bearer {NVIDIA_API_KEY}",
            "Content-Type": "application/json",
        },
        json={
            "model": "meta/llama-3.2-90b-vision-instruct",
            "messages": [
                {
                    "role": "user",
                    "content": [
                        {"type": "text", "text": "This is an official identity card."},
                        {"type": "image_base64", "image_base64": image_b64},
                        {
                            "type": "text",
                            "text": f"Question: {query}\nAnswer clearly and precisely."
                        },
                    ],
                }
            ],
            "max_tokens": 300,
            "temperature": 0.2,
        },
        timeout=120,
    )

    response.raise_for_status()
    return response.json()["choices"][0]["message"]["content"]

# ---------- MAIN ----------
if __name__ == "__main__":
    ensure_collection()

    image_path = os.path.join(DOCS_DIR, "Singapore_NID_F 1.jpeg")
    ingest_image(image_path)

    query = "What is the first name mentioned in the ID?"
    print("\nQ:", query)
    print("A:", vision_rag(query))



