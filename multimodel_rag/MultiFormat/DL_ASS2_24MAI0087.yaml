  self_ref: '#/texts/14'
  text: 1.1 Measuring Bias and Fairness
- children: []
  content_layer: body
  label: text
  orig: Bias in artificial intelligence systems refers to systematic and unfair discrimination
    that leads to unjust or unequal outcomes, particularly against certain groups
    defined by characteristics such as gender, race, age, or income. Measuring bias
    is the first essential step in creating ethical, trustworthy, and fair AI systems.
  parent:
    $ref: '#/body'
  prov:
  - bbox:
      b: 160.91000366210938
      coord_origin: BOTTOMLEFT
      l: 72.14400482177734
      r: 517.6079711914062
      t: 219.93800354003906
    charspan:
    - 0
    - 327
    page_no: 1
  self_ref: '#/texts/15'
  text: Bias in artificial intelligence systems refers to systematic and unfair discrimination
    that leads to unjust or unequal outcomes, particularly against certain groups
    defined by characteristics such as gender, race, age, or income. Measuring bias
    is the first essential step in creating ethical, trustworthy, and fair AI systems.
- children: []
  content_layer: body
  label: text
  orig: Bias is typically detected by observing how predictions vary across different
    groups. If a machine learning model favors one group more than another in terms
    of accuracy, outcomes, or benefits, it is considered biased.
  parent:
    $ref: '#/body'
  prov:
  - bbox:
      b: 105.54800415039062
