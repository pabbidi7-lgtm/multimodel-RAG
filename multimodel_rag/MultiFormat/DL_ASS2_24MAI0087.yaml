  text: Dataset Overview
- children: []
  content_layer: body
  label: text
  orig: The Adult Income dataset from UCI contains census records and aims to predict
    whether a person's income exceeds $50,000 per year. It includes features such
    as age, education level, hours worked per week, occupation, and sex. In this context,
    gender is treated as a sensitive attribute to evaluate fairness.
