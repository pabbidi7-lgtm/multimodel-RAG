  text: Fairness Mitigation Technique
- children: []
  content_layer: body
  label: text
  orig: A bias mitigation technique called Exponentiated Gradient is applied. This
    method adjusts the m odel during training by introducing a fairness constraint
    known as Demographic Parity. The goal of this constraint is to ensure that the
    model gives equal selection rates (i.e., predicted positive outcomes) across all
    gender groups, regardless of their true labels.
