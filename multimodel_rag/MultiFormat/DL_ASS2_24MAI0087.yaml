  text: 1.4 Mitigating Bias and Cultural Implications Using Real-Time Scenario
- children: []
  content_layer: body
  label: text
  orig: Bias mitigation can be illustrated through real-time scenarios. Consider a
    hiring algorithm trained on historical company data that primarily includes male
    employees. This model may learn to favor male applicants, continuing a cycle of
    gender discrimination. Similarly, in financial lending, models may learn to reject
    loan applications from individuals in historically underserved communities due
    to biased historical trends.
  parent:
    $ref: '#/body'
  prov:
  - bbox:
