  text: Data Preprocessing
- children: []
  content_layer: body
  label: text
  orig: 'The dataset is cleaned to remove missing values. The income column is converted
    into binary labels: 1 for income greater than $50K and 0 for income less than
    or equal to $50K. Only a subset of numerical features such as age, education level,
    and hours worked per week is used for training the model. Gender is not included
    as a feature in training but is used as a sensitive attribute for fairness evaluation.'
